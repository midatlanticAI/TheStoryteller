# The Storyteller Game Master on your own Docker host.
#   1. Copy .env.example to .env and fill in GM_TOKEN and TUNNEL_TOKEN.
#   2. docker compose up -d --build
# Then sign in with Claude from the game's Settings on your phone.
services:
  gm:
    build:
      context: .
      dockerfile: apps/gm/Dockerfile
    image: storyteller-gm
    restart: unless-stopped
    environment:
      GM_TOKEN: ${GM_TOKEN:?set GM_TOKEN in .env}
    volumes:
      - claude-home:/home/gm

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - gm

volumes:
  claude-home:
